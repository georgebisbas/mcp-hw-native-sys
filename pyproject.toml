[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hw-native-sys-mcp"
version = "0.3.2"
description = "MCP server for multi-repo workflows in hw-native-sys"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "hw-native-sys" }
]
dependencies = [
  "mcp>=1.8.0,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
hw-native-sys-mcp = "mcp_hwnative_sys.server:main"

[tool.setuptools]
packages = ["mcp_hwnative_sys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "workspace: requires the full hw-native-sys sibling workspace (private repos); skipped in CI via -m 'not workspace'",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Explicit default rule set (pycodestyle E4/E7/E9 + Pyflakes F) so the lint
# gate behaves identically regardless of which ruff version runs it — newer
# ruff releases enable additional categories (DTZ, PERF, EXE, RUF, ...) by
# default, which made CI and local diverge.
select = ["E4", "E7", "E9", "F"]
