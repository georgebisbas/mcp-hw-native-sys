name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install
        run: |
          pip install --quiet -e ".[dev]"
          pip install --quiet "ruff==0.14.8"

      - name: Lint
        run: ruff check mcp_hwnative_sys/ tools/ tests/

      # The sibling repos (pypto, pypto-3.0-notes, ...) are private and cannot
      # be cloned anonymously, so the workspace-dependent audit and the
      # @pytest.mark.workspace smoke tests only run locally (pre-commit hook +
      # tools/check_fresh.sh). CI runs the sandboxed subset that needs only
      # this repo.
      - name: Tests (sandboxed)
        run: python -m pytest tests/ -m "not workspace"
